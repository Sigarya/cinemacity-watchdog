name: Prague IMAX 70mm ticket watch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/watch.yml'
  schedule:
    # Every five minutes. GitHub may delay or skip scheduled executions.
    - cron: '3/5 * * * *'
  workflow_dispatch:
    inputs:
      force_report:
        description: 'Notify for all currently listed January showtimes'
        type: boolean
        default: false

concurrency:
  group: prague-imax70mm-ticket-watch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check new IMAX 70mm showtimes (January 6-13)
        id: check
        run: |
          python3 watch.py --state state/seen.json --report report.md --title title.txt \
            ${{ inputs.force_report && '--force-report' || '' }}
      - name: Send notification as GitHub Issue
        if: steps.check.outputs.has_news == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --title "$(cat title.txt)" --body-file report.md \
            --assignee "${{ github.repository_owner }}")
          echo "Notification issue: $url"
          gh issue close "$url" --reason completed
      - name: Persist seen showtimes to prevent duplicate notifications
        run: |
          rm -f report.md title.txt
          if git diff --quiet -- state/seen.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/seen.json
          git commit -m "Update IMAX 70mm watch state"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
